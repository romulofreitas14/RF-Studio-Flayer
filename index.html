<style>
:root {
  --bg: #09090b;
  --sf: #18181b;
  --el: #232329;
  --in: #121215;
  --bd: #2e2e36;
  --ac: #06b6d4;
  --ac-light: #22d3ee;
  --ac-dark: #0284c7;
  --ac-soft: rgba(6, 182, 212, 0.15);
  --tx: #f4f4f5;
  --mu: #a1a1aa;
  --dg: #ef4444;
  --dg-soft: rgba(239, 68, 68, 0.15);
  --safe-b: 0px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  position: fixed;
  inset: 0;
  background: var(--bg);
  color: var(--tx);
  font: 13px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

button, select, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--safe-b, 0px);
  overflow: hidden;
}

/* PALCO CENTRAL */
#stage {
  flex: 1 1 0%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 54px 12px 10px;
  position: relative;
  background-color: var(--bg);
  background-image: radial-gradient(#232329 1px, transparent 1px);
  background-size: 18px 18px;
  touch-action: none;
  overflow: hidden;
}

canvas {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.08);
  touch-action: none;
  cursor: grab;
}

canvas:active {
  cursor: grabbing;
}

/* PÍLULA FLUTUANTE DE ZOOM DO PALCO (ESTILO CANVA / STUDIO) */
#zbar {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: inline-flex;
  align-items: center;
  background: rgba(24, 24, 27, 0.94);
  backdrop-filter: blur(8px);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 3px 5px;
  gap: 2px;
  z-index: 10;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
  user-select: none;
}

#zbar button {
  height: 28px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--tx);
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s, transform 0.1s;
}

#zbar .zb-step {
  width: 28px;
  color: var(--mu);
}

#zbar .zb-step:hover, #zbar .zb-step:active {
  background: var(--el);
  color: var(--ac-light);
}

#zbar #zReset {
  min-width: 52px;
  padding: 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ac-light);
  font-variant-numeric: tabular-nums;
}

#zbar #zReset:hover, #zbar #zReset:active {
  background: var(--ac-soft);
  transform: scale(0.96);
}

/* MENU FLUTUANTE RETRÁTIL DE ADIÇÃO (CANTO INFERIOR ESQUERDO) */
#addWrap {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

#addMenu {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: rgba(24, 24, 27, 0.96);
  backdrop-filter: blur(12px);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.68);
  width: 252px;
  transform-origin: bottom left;
  animation: popIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

#addWrap.open #addMenu {
  display: grid;
}

#addMenu .b {
  justify-content: flex-start;
  height: 36px;
  padding: 0 10px;
  font-size: 12px;
  color: var(--tx);
}

#addBtn {
  height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--ac), var(--ac-dark));
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 6px 20px rgba(6, 182, 212, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.16);
  user-select: none;
  transition: transform 0.15s, background 0.15s;
}

#addBtn svg {
  width: 16px;
  height: 16px;
  stroke-width: 2.4;
  transition: transform 0.2s ease;
}

#addWrap.open #addBtn {
  background: var(--el);
  color: var(--ac-light);
  border-color: var(--ac);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
}

#addWrap.open #addBtn svg {
  transform: rotate(45deg);
}

/* BARRA FLUTUANTE SUPERIOR */
#fbar {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(24, 24, 27, 0.94);
  backdrop-filter: blur(8px);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 4px;
  z-index: 10;
  max-width: calc(100% - 16px);
  overflow-x: auto;
  scrollbar-width: none;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}

#fbar::-webkit-scrollbar {
  display: none;
}

#fbar.collapsed .fb-item {
  display: none;
}

.b {
  min-width: 34px;
  height: 34px;
  padding: 0 9px;
  border-radius: 8px;
  background: var(--el);
  border: 1px solid var(--bd);
  color: var(--mu);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s ease;
}

.b svg {
  width: 15px;
  height: 15px;
  stroke-width: 2;
  flex-shrink: 0;
}

.b:hover, .b:active, .b.on {
  color: var(--ac-light);
  border-color: var(--ac);
  background: var(--ac-soft);
}

.b.danger:hover, .b.danger:active {
  color: var(--dg);
  border-color: var(--dg);
  background: var(--dg-soft);
}

.b.locked-btn {
  color: var(--dg);
  border-color: rgba(239, 68, 68, 0.45);
  background: var(--dg-soft);
}

.p {
  background: linear-gradient(135deg, var(--ac), var(--ac-dark));
  color: #fff;
  border-radius: 999px;
  padding: 11px 16px;
  font-weight: 600;
  font-size: 13px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-align: center;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
}

.p:active {
  transform: scale(0.98);
}

/* GAVETA INFERIOR */
#panel {
  background: var(--sf);
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  height: var(--ph, auto);
  transition: height 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
  z-index: 15;
}

#panel.is-min {
  height: auto !important;
}

#panel.is-min #sheetHead,
#panel.is-min #panes {
  display: none;
}

#panel.is-min #grip {
  height: 14px;
}

#grip {
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: ns-resize;
  touch-action: none;
  flex-shrink: 0;
}

#grip:after {
  content: "";
  width: 38px;
  height: 4px;
  border-radius: 9px;
  background: #52525b;
}

#sheetHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 14px 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  flex-shrink: 0;
}

#sheetTitle {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--ac-light);
}

#btnHidePanel {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  border-radius: 7px;
  background: var(--el);
  border: 1px solid var(--bd);
  color: var(--mu);
  font-size: 11px;
  font-weight: 500;
}

#btnHidePanel:active {
  color: var(--ac-light);
  border-color: var(--ac);
}

/* ABAS INFERIORES */
#tabs {
  display: flex;
  gap: 3px;
  padding: 4px 10px calc(8px + env(safe-area-inset-bottom, 4px)) 10px;
  background: var(--sf);
  flex-shrink: 0;
  order: 3;
}

#tabs button {
  flex: 1;
  padding: 5px 2px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 500;
  color: var(--mu);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 42px;
}

#tabs button svg {
  width: 17px;
  height: 17px;
  stroke-width: 1.85;
  transition: transform 0.15s, color 0.15s;
}

#tabs button.on {
  background: var(--el);
  color: var(--tx);
}

#tabs button.on svg {
  color: var(--ac-light);
  transform: translateY(-1px);
}

#tabs button.tab-save {
  color: var(--ac-light);
  background: rgba(6, 182, 212, 0.08);
  border: 1px solid rgba(6, 182, 212, 0.25);
}

#tabs button.tab-save.on {
  background: var(--ac-soft);
  border-color: var(--ac);
  color: #fff;
}

#panes {
  flex: 1;
  overflow-y: auto;
  padding: 8px 14px 18px;
  -webkit-overflow-scrolling: touch;
  order: 2;
}

.pane {
  display: none;
  flex-direction: column;
  gap: 10px;
}

.pane.on {
  display: flex;
}

.c {
  background: var(--el);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.l {
  font-size: 11px;
  font-weight: 500;
  color: var(--mu);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.l b {
  color: var(--ac-light);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

input[type=text], select, textarea {
  width: 100%;
  background: var(--in);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 8px 10px;
  outline: 0;
  font-size: 13px;
}

input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--ac);
}

/* CONTROLE NUMÉRICO COMPACTO (-) [VALOR] (+) COM ACELERAÇÃO AO SEGURAR */
.num-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--in);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 5px 8px;
}

.num-row .num-lbl {
  font-size: 11px;
  font-weight: 500;
  color: var(--mu);
  line-height: 1.2;
}

.g .num-row {
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  padding: 6px 8px;
}

.g .num-row .num-box {
  width: 100%;
  justify-content: space-between;
}

.num-box {
  display: inline-flex;
  align-items: center;
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
  flex-shrink: 0;
}

.num-step {
  width: 28px;
  height: 26px;
  border-radius: 5px;
  background: var(--el);
  color: var(--ac-light);
  font-weight: 700;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.num-step:hover {
  border: 1px solid rgba(6, 182, 212, 0.4);
}

.num-step:active {
  background: var(--ac);
  color: #fff;
}

.num-val-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

.num-inp {
  width: 46px !important;
  height: 26px;
  text-align: right;
  background: transparent !important;
  border: 0 !important;
  padding: 0 2px !important;
  font-size: 12px;
  font-weight: 700;
  color: var(--tx);
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}

.num-unit {
  font-size: 11px;
  font-weight: 600;
  color: var(--ac-light);
  margin-left: 1px;
  user-select: none;
}

.num-inp::-webkit-outer-spin-button,
.num-inp::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type=color] {
  width: 100%;
  height: 34px;
  border: 1px solid var(--bd);
  border-radius: 8px;
  background: var(--in);
  padding: 2px;
  cursor: pointer;
}

.chk-row {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 500;
  color: var(--tx);
  background: var(--in);
  border: 1px solid var(--bd);
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
}

.chk-row input[type=checkbox] {
  width: 15px;
  height: 15px;
  accent-color: var(--ac);
  margin: 0;
}

.g {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.r {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  transition: opacity 0.2s;
}

fieldset:disabled {
  opacity: 0.38;
  pointer-events: none;
}

/* LISTA DE CAMADAS */
.it {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 6px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--in);
  transition: border-color 0.15s, background 0.15s, transform 0.12s, box-shadow 0.15s;
  position: relative;
}

.it.on {
  border-color: var(--ac);
  background: var(--ac-soft);
}

.it.dragging {
  border-color: var(--ac-light);
  background: rgba(6, 182, 212, 0.24);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65);
  z-index: 25;
  transform: scale(1.015);
}

.it-drag {
  width: 24px;
  height: 32px;
  border-radius: 6px;
  color: var(--mu);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
  flex-shrink: 0;
  user-select: none;
}

.it-drag:hover, .it-drag:active, .it.dragging .it-drag {
  color: var(--ac-light);
  background: rgba(6, 182, 212, 0.14);
  cursor: grabbing;
}

.it-drag svg {
  width: 14px;
  height: 14px;
}

/* PRESETS DE CORES E DEGRADÊS DE FUNDO */
.swatches {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.sw-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 2px solid var(--bd);
  cursor: pointer;
  transition: transform 0.12s, border-color 0.15s;
}

.sw-btn:hover, .sw-btn.on {
  border-color: var(--ac-light);
  transform: scale(1.08);
}

.grad-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.grad-preset {
  height: 38px;
  border-radius: 8px;
  border: 1.5px solid var(--bd);
  padding: 4px 6px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.85);
  cursor: pointer;
  transition: transform 0.12s, border-color 0.15s;
  overflow: hidden;
}

.grad-preset:hover, .grad-preset:active {
  border-color: var(--ac-light);
  transform: translateY(-1px);
}

optgroup {
  background: #121215;
  color: var(--ac-light);
  font-weight: 700;
  font-style: normal;
}

option {
  background: #18181b;
  color: var(--tx);
  font-weight: 500;
  padding: 4px;
}

.it-main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  padding: 5px 4px;
  cursor: pointer;
}

.it-ico {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--el);
  color: var(--ac-light);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.it-ico svg {
  width: 13px;
  height: 13px;
  stroke-width: 2;
}

.it-lbl {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 500;
}

.it .b {
  min-width: 28px;
  height: 28px;
  padding: 0;
}

.seg {
  display: flex;
  gap: 3px;
  background: var(--in);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  flex-wrap: wrap;
}

.seg button {
  flex: 1;
  padding: 7px 6px;
  border-radius: 6px;
  color: var(--mu);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.seg button.on {
  background: var(--ac-soft);
  color: var(--ac-light);
  border: 1px solid rgba(6, 182, 212, 0.3);
}

select optgroup {
  background: var(--sf);
  color: var(--ac-light);
  font-weight: 700;
  font-style: normal;
}

select option {
  background: var(--in);
  color: var(--tx);
  font-weight: 400;
  padding: 4px;
}

.hint {
  font-size: 11px;
  color: var(--mu);
  text-align: center;
  line-height: 1.4;
}

/* MODAL DE EXPORTAÇÃO */
#mo {
  position: fixed;
  inset: 0;
  background: rgba(9, 9, 11, 0.9);
  backdrop-filter: blur(10px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  z-index: 50;
}

.mo-card {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
}

#mo img {
  max-width: 100%;
  max-height: 58dvh;
  border-radius: 8px;
  border: 1px solid var(--bd);
}

/* TOAST DISCRETO */
#toast {
  position: fixed;
  bottom: calc(74px + var(--safe-b, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--el);
  color: var(--tx);
  border: 1px solid var(--ac);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
